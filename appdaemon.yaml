appdaemon:
  latitude: !secret latitude
  longitude: !secret longitude
  elevation: !secret elevation
  time_zone: !secret time_zone
  total_threads: 10
  thread_duration_warning_threshold: 120 # 0 doesn't appear to work - https://appdaemon.readthedocs.io/en/latest/CONFIGURE.html
  plugins:
    HASS:
      type: hass
      ha_url: http://homeassistant.local:8123
      token: !secret appdaemon_token
      cert_verify: True
http:
  url: http://homeassistant.local:5050
api:
admin:
hadashboard:
