automationbase:
  module: automationbase
  class: AutomationBase
  log_level: INFO

announcer:
  module: announcer
  class: Announcer
  log_level: INFO
  dependencies: # timestamp causes cyclic dependency
    - automationbase

timestamp:
  module: timestamp
  class: Timestamp
  log_level: INFO
  dependencies:
    - automationbase
    - announcer

automation:
  module: automation
  class: Automation
  log_level: INFO
  dependencies:
    - automationbase
    - announcer
    - timestamp

motion:
  module: motion
  class: Motion
  reset_on_off: false
  log_level: INFO
  dependencies:
    - automationbase
    - announcer
    - timestamp

lighting:
  module: lighting
  class: Lighting
  log_level: INFO
  dependencies:
    - automationbase
    - announcer
    - timestamp
    - motion

timers:
  module: timers
  class: Timers
  log_level: INFO
  dependencies:
    - automationbase
    - announcer
    - timestamp

location:
  module: location
  class: Location
  log_level: INFO
  dependencies:
    - automationbase
    - announcer
    - timestamp
    - lighting

alarms:
  module: alarms
  class: Alarms
  log_level: INFO
  dependencies:
    - automationbase
    - announcer
    - timestamp

