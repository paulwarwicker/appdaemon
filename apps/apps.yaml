announcer:
  module: announcer
  class: Announcer
  log_level: INFO
  dependencies:
    - automationlib
    - const
    # - timestamp # causes cyclic dependency

automation:
  module: automation
  class: Automation
  log_level: INFO
  dependencies:
    - automationlib
    - const
    - announcer
    - timestamp

