  module: sonos
  class: Sonos
  log_level: INFO
  dependencies:
    - automationbase
    - announcer
    - timestamp

garage:
  module: garage
  class: Garage
  log_level: INFO
  dependencies:
    - automationbase
    - announcer
    - timestamp

weather:
  module: weather
  class: Weather
  log_level: INFO
  # location: 78704 US
  dependencies:
    - announcer

tap:
  module: tap
  class: Tap
  log_level: INFO
  dependencies:
    - automationbase
    - announcer
    - timestamp

vacuum:
  module: vacuum
  class: Vacuum
  log_level: INFO
  dependencies:
    - automationbase
    - announcer
    - timestamp

